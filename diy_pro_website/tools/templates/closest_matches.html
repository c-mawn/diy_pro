<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Closest Matches</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <h1>Closest Matches</h1>
  <div class="closest_matches-list">
    {% for tool in tools %}
    <div class="closest_matches-card">
      <div class="closest_matches-name">{{ tool.Name }}</div>
      {% if tool.Image %}
        <img src="{{ tool.Image }}" alt="{{ tool.Name }}">
      {% else %}
        <div class="no-image">(no image)</div>
      {% endif %}
      <div class="closest_matches-description">{{ tool.Description }}</div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
