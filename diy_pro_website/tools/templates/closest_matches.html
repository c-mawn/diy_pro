<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Closest Matches</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f0f8ff;
    }

    h1 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 40px;
      font-size: 2em;
    }

    .tool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: flex-start; /* important: prevent row height stretch */
    }

    .tool-card {
      background-color: #ffffff;
      border: 2px solid #cce5ff;
      border-radius: 12px;
      padding: 20px;
      width: calc(25% - 30px);
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      position: relative;
      /* remove any fixed height */
    }

    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .tool-card img {
      max-height: 150px;
      margin-top: 10px;
      margin-bottom: 5px;
      border-radius: 8px;
    }

    .tool-name {
      font-weight: bold;
      color: #007BFF;
      font-size: 1.3em;
    }

    /* Description initially hidden */
    .tool-description {
      color: #333;
      font-size: 1em;
      margin-top: 10px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.5s ease;
    }

    /* Reveal description on hover */
    .tool-card:hover .tool-description {
      max-height: 500px; /* enough for longer text */
      opacity: 1;
    }

    .no-image {
      color: #666;
      font-size: 1em;
      margin-top: 15px;
    }

    @media (max-width: 1200px) {
      .tool-card {
        width: calc(33.33% - 30px);
      }
    }

    @media (max-width: 900px) {
      .tool-card {
        width: calc(50% - 20px);
      }
    }

    @media (max-width: 600px) {
      .tool-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>Closest Matches</h1>
  <div class="tool-list">
    {% for tool in tools %}
    <div class="tool-card">
      <div class="tool-name">{{ tool.Name }}</div>
      {% if tool.Image %}
        <img src="{{ tool.Image }}" alt="{{ tool.Name }}">
      {% else %}
        <div class="no-image">(no image)</div>
      {% endif %}
      <div class="tool-description">{{ tool.Description }}</div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
