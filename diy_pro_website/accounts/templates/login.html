{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expert Repairer Log In</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
  <style>
    form {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border: 2px solid #cce5ff;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 10px;
      border: 2px solid #cce5ff;
      border-radius: 8px;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #007BFF;
    }

    button {
      padding: 10px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    p {
      text-align: center;
      margin-top: 10px;
    }

    p a {
      color: #007BFF;
      text-decoration: none;
      font-weight: bold;
    }

    p a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Expert Repairer Log In</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="POST">
      {% csrf_token %}
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
  </form>
  <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>.</p>
</body>
</html>
